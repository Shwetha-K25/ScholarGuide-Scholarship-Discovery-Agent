<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="50%" stop-color="#1B6CA8"/>
      <stop offset="100%" stop-color="#2E86AB"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle dot pattern -->
  <g fill="#FFFFFF" opacity="0.05">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="200" cy="40" r="2"/>
    <circle cx="350" cy="90" r="3"/>
    <circle cx="500" cy="50" r="2"/>
    <circle cx="700" cy="70" r="3"/>
    <circle cx="900" cy="40" r="2"/>
    <circle cx="1100" cy="80" r="3"/>
    <circle cx="1200" cy="50" r="2"/>
    <circle cx="80" cy="200" r="2"/>
    <circle cx="1200" cy="200" r="2"/>
    <circle cx="60" cy="400" r="2"/>
    <circle cx="1220" cy="400" r="2"/>
  </g>

  <!-- Graduation cap -->
  <g filter="url(#shadow)" transform="translate(480, 120)">
    <!-- Cap top -->
    <polygon points="160,0 320,50 160,100 0,50" fill="#FFFFFF"/>
    <!-- Cap band -->
    <path d="M 70,70 L 70,110 Q 160,140 250,110 L 250,70 L 160,100 Z" fill="#E0E0E0"/>
    <!-- Tassel -->
    <line x1="280" y1="44" x2="280" y2="120" stroke="#FFD700" stroke-width="3"/>
    <circle cx="280" cy="124" r="6" fill="url(#gold)"/>
    <!-- Tassel cord -->
    <path d="M 280,44 Q 300,60 310,80" stroke="#FFD700" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Title -->
  <text x="640" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF" filter="url(#shadow)">
    ScholarGuide
  </text>

  <!-- Subtitle -->
  <text x="640" y="395" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#FFD700">
    AI-Powered Scholarship Discovery Agent
  </text>

  <!-- Tag line -->
  <text x="640" y="440" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFFFFF" opacity="0.85">
    Bilingual English &amp; Tamil · Strands SDK · Amazon Bedrock
  </text>

  <!-- State badges -->
  <g transform="translate(390, 500)">
    <rect x="0" y="0" width="140" height="44" rx="22" fill="#FFFFFF" opacity="0.15"/>
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFFFFF">Tamil Nadu</text>

    <rect x="170" y="0" width="110" height="44" rx="22" fill="#FFFFFF" opacity="0.15"/>
    <text x="225" y="29" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFFFFF">Kerala</text>

    <rect x="310" y="0" width="130" height="44" rx="22" fill="#FFFFFF" opacity="0.15"/>
    <text x="375" y="29" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#FFFFFF">Karnataka</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="620" width="1280" height="20" fill="url(#gold)"/>
</svg>
